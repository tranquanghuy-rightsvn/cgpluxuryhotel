<!DOCTYPE html>
<!-- Social share image (og:image) template. Rendered to images/og/share.jpg (1200x630) by build.py via headless Chrome. -->
<html lang="vi">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/fonts.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #002040; }
  .og { position: relative; width: 1200px; height: 630px; }
  .og img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% 58%; }
  .og::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(0, 32, 64, 0) 38%, rgba(0, 32, 64, .62) 62%, rgba(0, 32, 64, .9) 100%); }
  .txt { position: absolute; z-index: 1; right: 64px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; text-align: right; color: #fff; }
  .eyebrow { font: 700 26px/1 "Open Sans", sans-serif; letter-spacing: .32em; margin-right: -.32em; color: #d9bf9f; text-transform: uppercase; }
  .rule { width: 96px; height: 3px; background: #b19579; margin: 26px 0 28px; }
  h1 { margin: 0; font: 500 64px/1.12 "Playfair Display", Georgia, serif; text-shadow: 0 2px 18px rgba(0, 0, 0, .45); }
  .url { margin-top: 30px; font: 400 21px/1 "Open Sans", sans-serif; letter-spacing: .06em; color: rgba(255, 255, 255, .85); }
</style>
</head>
<body>
<div class="og">
  <img src="../images/hero-facade-night.jpg" alt="">
  <div class="txt">
    <div class="eyebrow">CGP Group</div>
    <div class="rule"></div>
    <h1>CGP Luxury Hotel Hoi An</h1>
    <div class="url">cgpgrouphotel.com</div>
  </div>
</div>
</body>
</html>
