name: Build site + deploy Worker

# Chỉ chạy ở file LUÔN là commit CHỐT của một thao tác trong GAS CMS (GAS.md mục VIII) — không trigger
# theo cả thư mục: một lần Lưu bài sinh nhiều commit (ảnh -> 6 file ngôn ngữ -> index.json), build từ
# commit đầu sẽ deploy trạng thái dở dang.
on:
  push:
    branches: [master]
    paths:
      - "content/tin-tuc/index.json"
      - "data/packages.json"
      - "data/settings.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build.py gọi `magick` (ImageMagick 7) + `cwebp`. Ubuntu có ImageMagick 6 -> lớp vỏ `magick`.
      - name: Công cụ ảnh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp > /dev/null
          printf '#!/bin/sh\ncase "$1" in identify|mogrify|montage|composite) c=$1; shift; exec "$c" "$@";; *) exec convert "$@";; esac\n' | sudo tee /usr/local/bin/magick > /dev/null
          sudo chmod +x /usr/local/bin/magick

      # Checkout đặt mọi file cùng một mtime, mà build.py quyết định "ảnh phái sinh đã cũ chưa" bằng mtime.
      # Đẩy ảnh gốc về quá khứ -> chỉ ảnh phái sinh CHƯA CÓ (ảnh mới từ CMS) mới được tạo.
      # (Ảnh cover CMS luôn mang tên mới mỗi lần upload nên không bao giờ dính bản phái sinh cũ.)
      - name: Giữ nguyên ảnh phái sinh đã commit
        run: |
          find html/images -maxdepth 1 -type f \( -name '*.jpg' -o -name '*.png' \) -exec touch -d '2000-01-01' {} +
          touch -d '2000-01-01' html/.work/og-share.html

      - run: npm ci

      - name: Build html/ + worker/packages.json + worker/settings.json
        working-directory: html
        run: python3 .work/build.py

      - name: Commit kết quả build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A html/ worker/packages.json worker/settings.json
          git diff --cached --quiet && echo "Không có thay đổi." && exit 0
          git commit -q -m "CI: build html từ CMS"
          git push

      - name: D1 migrations + deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply cgpluxuryhotel --remote
          npx wrangler deploy
